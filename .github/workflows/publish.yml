name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    
    # npm 배포 권한 설정
    permissions:
      contents: write   # 릴리스 태그 푸시
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build packages
        run: npm run build
      
      - name: Run tests
        run: npm run test
      
      - name: Check if version changed
        id: check-version
        run: |
          # core 패키지 버전 확인
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "version=$CORE_VERSION" >> $GITHUB_OUTPUT
          
          # npm에 이미 배포된 버전인지 확인
          if npm view @flux-mask/core@$CORE_VERSION version 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version $CORE_VERSION already published"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New version $CORE_VERSION will be published"
          fi
      
      - name: Publish to npm
        if: steps.check-version.outputs.changed == 'true'
        run: |
          npm config set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
          npm run publish:all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      # 태그 푸시는 개인 토큰(secrets.TOKEN)을 쓰고 있었는데, 만료되면
      # 401 로 죽는다. 실제로 2025-12-01 배포에서 npm 게시는 끝나고 이 단계만
      # 실패했다. 기본 GITHUB_TOKEN 은 만료가 없다 — 위 permissions 에
      # contents: write 를 더했다.
      - name: Create Git tag
        if: steps.check-version.outputs.changed == 'true'
        run: |
          VERSION=${{ steps.check-version.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
