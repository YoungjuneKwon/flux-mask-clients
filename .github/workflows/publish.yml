name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    
    # npm 배포 권한 설정
    permissions:
      contents: write   # 릴리스 태그 푸시
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing(OIDC)은 npm 11.5.1+ / Node 22.14+ 를 요구한다.
          # Node 18 은 npm 10 이라 OIDC 를 쓰지 못하고 토큰으로 떨어진다.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 가 들고 오는 npm 은 10.x 다. OIDC 는 11.5.1+ 에서만 동작하고,
      # 그 아래에서는 조용히 토큰 인증으로 떨어져 404 가 난다(실제로 그랬다).
      - name: Upgrade npm for OIDC
        run: |
          npm install -g npm@latest
          npm --version
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build packages
        run: npm run build
      
      - name: Run tests
        run: npm run test
      
      - name: Check if version changed
        id: check-version
        run: |
          # core 패키지 버전 확인
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "version=$CORE_VERSION" >> $GITHUB_OUTPUT
          
          # npm에 이미 배포된 버전인지 확인
          if npm view @flux-mask/core@$CORE_VERSION version 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version $CORE_VERSION already published"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New version $CORE_VERSION will be published"
          fi
      
      # 토큰을 쓰지 않는다.
      #
      # npmjs.com 에서 패키지 3개에 신뢰 발행자(YoungjuneKwon/flux-mask-clients,
      # publish.yml)를 등록해 뒀다. npm CLI 가 OIDC 환경을 감지해 수초짜리
      # 자격을 받아 게시한다. 긴 수명 토큰이 없으니 만료도 유출도 없다.
      #
      # NPM_TOKEN 을 남겨 두면 OIDC 실패 시 조용히 토큰으로 떨어져, 어느 쪽으로
      # 인증됐는지 알 수 없게 된다. 그래서 아예 걷어낸다.
      - name: Publish to npm (OIDC)
        if: steps.check-version.outputs.changed == 'true'
        run: npm run publish:all
      
      # 태그 푸시는 개인 토큰(secrets.TOKEN)을 쓰고 있었는데, 만료되면
      # 401 로 죽는다. 실제로 2025-12-01 배포에서 npm 게시는 끝나고 이 단계만
      # 실패했다. 기본 GITHUB_TOKEN 은 만료가 없다 — 위 permissions 에
      # contents: write 를 더했다.
      - name: Create Git tag
        if: steps.check-version.outputs.changed == 'true'
        run: |
          VERSION=${{ steps.check-version.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
